name: JP Build

on:
  schedule:
    # Run after upstream's nightly (14:00 UTC) so we build the freshest source
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the rolling release
  issues: write   # needed to open a failure-notification issue

concurrency:
  group: jp-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    name: Build JP YimMenuV2
    steps:
      - name: Disable CRLF conversion (so the patch applies cleanly)
        run: git config --global core.autocrlf false

      - name: Checkout upstream source (latest enhanced)
        uses: actions/checkout@v4
        with:
          repository: YimMenu/YimMenuV2
          ref: enhanced
          path: upstream

      - name: Checkout my patches
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Apply patches
        working-directory: upstream
        shell: bash
        run: |
          shopt -s nullglob
          patches=(../fork/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then echo "No patches found"; exit 1; fi
          for p in "${patches[@]}"; do
            echo "::group::Applying $p"
            git apply --3way --ignore-whitespace --verbose "$p"
            echo "::endgroup::"
          done

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generate CMake project
        working-directory: upstream
        run: cmake -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -S . -B build -G Ninja

      - name: Build YimMenuV2
        working-directory: upstream
        run: cmake --build ./build --config RelWithDebInfo --target YimMenuV2 --

      - name: Check if DLL got built
        working-directory: upstream
        run: if (-Not (Test-Path -path "build/YimMenuV2.dll")) { throw 1 }

      - name: Record upstream commit
        id: sha
        working-directory: upstream
        run: |
          echo "full=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          echo "short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimMenuV2-jp
          path: |
            upstream/build/YimMenuV2.dll
            upstream/build/YimMenuV2.pdb

      - name: Echo build sha256
        id: build_sha
        working-directory: upstream/build
        run: |
          $hash = (Get-FileHash YimMenuV2.dll -Algorithm SHA256).Hash
          echo "value=$hash" >> $env:GITHUB_OUTPUT
          echo $hash

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2.2.2
        with:
          name: JP Nightly [${{ steps.sha.outputs.short }}]
          tag_name: jp-nightly
          body: |
            JP-patched build of YimMenuV2 (in-game CJK text renders instead of "???"; menu UI stays English).
            Built automatically by GitHub Actions from upstream `enhanced`.

            Upstream commit: `${{ steps.sha.outputs.full }}`
            DLL SHA256:
            ```
            ${{ steps.build_sha.outputs.value }}
            ```
            For testing purposes only. No warranty.
          files: upstream/build/YimMenuV2.dll

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "JP Build failed"
          $run   = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body  = @"
          The scheduled **JP Build** failed.

          Run: $run

          The most likely cause is that upstream changed the font setup and ``patches/jp-font.patch`` no longer applies.
          Re-generate the patch against the latest ``enhanced`` and push it:

          1. ``git clone https://github.com/YimMenu/YimMenuV2 && cd YimMenuV2``
          2. edit ``src/game/frontend/Menu.cpp`` (CreateFontWithCyrillicSupport) to merge a JP system font
          3. ``git diff -- src/game/frontend/Menu.cpp > patches/jp-font.patch`` and push it to this fork

          This issue is auto-managed: it will be commented on for repeated failures.
          "@
          $existing = gh issue list --repo $env:GITHUB_REPOSITORY --state open --search "$title in:title" --json number --jq '.[0].number'
          if ($existing) {
            gh issue comment $existing --repo $env:GITHUB_REPOSITORY --body $body
          } else {
            gh issue create --repo $env:GITHUB_REPOSITORY --title $title --body $body --label "ci-failure"
          }

      # Prevent GitHub from auto-disabling the schedule after 60 days of repo
      # inactivity. Runs even on build failure so the schedule survives a patch
      # outage. Commits a real file change only when the last commit is old, so
      # history stays clean (~1 commit per 45 days).
      - name: Keep schedule alive
        if: always()
        working-directory: fork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit on the fork was $age_days day(s) ago."
          if [ "$age_days" -ge 45 ]; then
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
            git add .github/keepalive
            git commit -m "chore: keepalive to prevent scheduled-workflow auto-disable [skip ci]"
            git push origin HEAD:enhanced
            echo "Pushed keepalive commit."
          else
            echo "No keepalive needed yet (< 45 days)."
          fi
